name: Auto Update Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Upstream Tags
        run: |
          git remote add upstream https://github.com/Moulberry/PandoraLauncher.git
          git fetch upstream --tags --force

      - name: Check for new tags and Rebase
        run: |
          LATEST_UPSTREAM_TAG=$(git ls-remote --tags --refs upstream | grep -o 'refs/tags/v.*' | sed 's/refs\/tags\///' | sort -V | tail -n1)

          if [ -z "$LATEST_UPSTREAM_TAG" ]; then
            echo "No tags found in upstream."
            exit 0
          fi

          echo "Latest upstream tag is: $LATEST_UPSTREAM_TAG"
          git checkout master

          if git merge-base --is-ancestor "$LATEST_UPSTREAM_TAG" HEAD; then
            echo "Branch is already rebased on top of $LATEST_UPSTREAM_TAG"
            exit 0
          fi

          echo "Rebasing onto $LATEST_UPSTREAM_TAG"
          git rebase $LATEST_UPSTREAM_TAG
          
          git tag --force $LATEST_UPSTREAM_TAG
          
          git push --force origin master
          git push --force origin $LATEST_UPSTREAM_TAG
